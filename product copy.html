<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>
</head>

<body>

    <header>
        <nav>
            <a href="productlist.html">Back to products</a>
        </nav>
    </header>

    <main class="product-page">

        <article class="product-card">

            <h1 class="product-title">Summer T-Shirt</h1>

            <img src="https://kea-alt-del.dk/t7/images/webp/640/1529.webp" alt="Summer T-Shirt" class="product-image">

            <section class="product-info">
                <p class="product-brand">Brand: SunnyWear</p>
                <p class="product-price">Price: 199 DKK</p>
                <p class="product-old-price">Old price: 299 DKK</p>
                <p class="product-status">Lagerstatus: In Stock</p>
            </section>

            <button type="button" class="add-to-basket">
                Add to basket
            </button>

        </article>

    </main>

</body>

</html>
