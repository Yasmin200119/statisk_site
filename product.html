<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Statisk/Dynamisk Fashion</h1>
        <nav>
            <a class="back-to-categories" href="index.html">Back to categories</a>
        </nav>
    </header>

    <main id="product">
        <article class="product-card">
            <img src="https://kea-alt-del.dk/t7/images/webp/640/1529.webp" class="product-image">
            <h1 class="product-title">Summer T-Shirt</h1>
            <div id="productContainer">
                <section class="product-info">
                    <p class="product-brand">Brand: SunnyWear</p>
                    <p class="product-price">Price: 199 DKK</p>
                    <p class="product-old-price">Old price: 299 DKK</p>
                    <p class="product-status">Lagerstatus: In Stock</p>
                </section>
            </div>

            <button type="button" class="add-to-basket">
                Add to basket
            </button>
        </article>

    </main>
    <script src="js/product.js"></script>
</body>

</html>
