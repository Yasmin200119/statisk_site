<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productlist</title>

</head>

<body>

    <header>
        <h1>Pure Fashion's Summer Collection 2026</h1>
        <nav>
            <a class="back-to-categories" href="index.html">Back to categories</a>
        </nav>
    </header>


    <!-- GRID CONTAINER TIL PRODUKTER -->
    <main class="product-list">

        <!-- Product 1 -->
        <article class="product">
            <a href="product.html">
                <img src="https://kea-alt-del.dk/t7/images/webp/640/1529.webp" alt="Summer T-Shirt">
                <h2>Summer T-Shirt</h2>
            </a>
            <p>Brand: SunnyWear</p>
            <p>Price: 199 DKK</p>
        </article>

        <!-- Product 2 (Sold Out) -->
        <article class="product">
            <a href="product.html">
                <img src="https://kea-alt-del.dk/t7/images/webp/640/1530.webp" alt="Beach Shorts">
                <h2>Beach Shorts</h2>
            </a>
            <p>Brand: OceanStyle</p>
            <p>Price: 249 DKK</p>
            <p class="soldout">Sold Out</p>
        </article>

        <!-- Product 3 (On Sale) -->
        <article class="product">
            <a href="product.html">
                <img src="https://kea-alt-del.dk/t7/images/webp/640/1531.webp" alt="Flip Flops">
                <h2>Flip Flops</h2>
            </a>
            <p>Brand: WalkEasy</p>
            <p>Price: 99 DKK</p>
            <p class="sale">On Sale!</p>
        </article>

        <!-- Product 4 -->
        <article class="product">
            <a href="product.html">
                <img src="https://kea-alt-del.dk/t7/images/webp/640/1532.webp" alt="Sunglasses">
                <h2>Sunglasses</h2>
            </a>
            <p>Brand: SunPro</p>
            <p>Price: 149 DKK</p>
        </article>

    </main>

</body>

</html>
